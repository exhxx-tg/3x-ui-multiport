apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: x-ui-pro
  namespace: x-ui-pro
  labels:
    app.kubernetes.io/name: x-ui-pro
    app.kubernetes.io/part-of: x-ui-pro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: x-ui-pro
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
